[project]
name = "physical-ai-triage"
version = "0.1.0"
description = "6-model retrieval bake-off + metadata-lift experiment on 95K autonomous-driving frames."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "Rafael Marañón" }]

dependencies = [
  # Embedding model + tokenizers
  "torch>=2.3,<3.0",
  "transformers>=4.44,<5.0",
  "pillow>=10.0",
  "numpy>=1.26,<3.0",
  # Vector + columnar storage
  "lancedb>=0.13,<1.0",
  "pyarrow>=15.0",
  "duckdb>=1.0",
  # Cloud-agnostic storage (Decisions 2, 6, 10, 11)
  "fsspec>=2024.5",
  "s3fs>=2024.5",
  "gcsfs>=2024.5",
  "boto3>=1.34",
  # BigQuery (Waymo public dataset is the SOURCE; sink is S3 via fsspec)
  "google-cloud-bigquery>=3.20",
  "google-cloud-storage>=2.16",
  "db-dtypes>=1.2",
  # MCAP for visualization-tool integration
  "mcap>=1.2",
  # CLI + config
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "tqdm>=4.66",
  "sentencepiece>=0.2.1",
  # Integrations (Decision 21 — live, not stub)
  "snowflake-connector-python>=3.0",
  "datadog-api-client>=2.30",
  "torchvision>=0.27.0",
  "einops>=0.8.2",
  "flask>=3.1.3",
  "umap-learn>=0.5.12",
  "plotly>=6.7.0",
  "clickhouse-connect>=1.0.1",
  "wandb>=0.27.0",
  "anthropic>=0.104.1",
  "foxglove-schemas-protobuf>=0.3.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.0",
  "ipykernel>=6.29",
  "jupyter>=1.0",
]
gpu = [
  # Install with: `uv sync --extra gpu` on a CUDA box
  # torch wheels with CUDA come from the official PyTorch index — set
  # UV_TORCH_BACKEND=cu121 or pass --index https://download.pytorch.org/whl/cu121
  "accelerate>=0.33",
]

[project.scripts]
avtri = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter
